# Opens a PR when an app in this tap has a newer GitHub release than its cask.
# Runs on a schedule so the app repos need no token for this repo; the app's own
# updater (Sparkle) keeps installed copies current, so a few hours' lag only affects
# new installs. repository_dispatch (type `bump-casks`) lets a release trigger it later.
name: bump casks

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [bump-casks]

permissions:
  contents: write # push the bump branch
  pull-requests: write # open the PR

concurrency:
  group: bump-casks
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cask: azimuth
            repo: ai-screams/Azimuth
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update the cask
        id: bump
        run: bash scripts/bump-cask.sh "Casks/${{ matrix.cask }}.rb" "${{ matrix.repo }}"

      - name: Open a PR
        if: steps.bump.outputs.changed == 'true'
        env:
          CASK: ${{ matrix.cask }}
          VERSION: ${{ steps.bump.outputs.version }}
          REPO: ${{ matrix.repo }}
        run: |
          branch="bump/$CASK-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists; leaving its PR alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$CASK $VERSION"
          git push origin "$branch"
          gh pr create --head "$branch" --title "$CASK $VERSION" \
            --body "Updates \`Casks/$CASK.rb\` to [$VERSION](https://github.com/$REPO/releases/tag/v$VERSION). The sha256 is the release's \`.sha256\` file, checked against the downloaded DMG."
